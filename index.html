<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>РЦЗК — информационный портал</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--navy:#082b59;--blue:#1264aa;--ice:#edf5fc;--ink:#183451;--muted:#667d94}*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:var(--ink);font-family:Arial,'Segoe UI',sans-serif}.app{max-width:760px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 8px 45px #12365d12}.hero{position:relative;overflow:hidden;padding:25px 22px 29px;color:white;background:linear-gradient(125deg,#082750 5%,#125da1 80%,#2492ce)}.hero:after{content:'⚛';position:absolute;right:-21px;top:-49px;font-size:185px;opacity:.13}.kicker{font-size:11px;letter-spacing:2px;font-weight:700;opacity:.8}.hero h1{position:relative;font-size:28px;line-height:1.13;margin:16px 0 9px}.hero p{position:relative;max-width:480px;line-height:1.55;font-size:13px;margin:0;color:#e1ecf8}.tabs{display:flex;overflow:auto;gap:6px;padding:12px;position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid #e1e9f2;scrollbar-width:thin}.tab{background:#edf3f9;border:0;padding:11px 12px;border-radius:10px;color:#345574;font-weight:700;white-space:nowrap;cursor:pointer}.tab.active{background:var(--navy);color:white}.content{padding:21px 20px 35px}.eyebrow{color:var(--blue);font-size:11px;text-transform:uppercase;letter-spacing:1.8px;font-weight:bold}.content h2{font-size:25px;margin:9px 0 10px;color:var(--navy)}.lead{font-size:14px;line-height:1.65;color:var(--muted);margin:0 0 22px}.cards{display:grid;gap:12px}.card{border:1px solid #e2ebf5;border-radius:15px;padding:19px;background:linear-gradient(155deg,#fff,#f5f9fd)}.card .icon{font-size:26px}.card h3{margin:12px 0 7px;font-size:17px;color:var(--navy)}.card p{font-size:13px;color:#506980;line-height:1.6;margin:0}.small{font-size:12px;color:#71869a}.foot{background:#092d5a;color:#dbeafa;padding:17px 22px;font-size:11px;letter-spacing:1px;text-align:center}.notice{border-left:4px solid #2a86c7;background:#edf6ff;padding:13px 14px;border-radius:6px;font-size:13px;line-height:1.5;margin:8px 0 23px}.link{display:inline-block;color:#1764a5;text-decoration:none;font-weight:700;margin-top:12px}.link:hover{text-decoration:underline}@media(min-width:600px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:38px}.hero h1{font-size:35px}}
</style></head><body><div class="app"><header class="hero"><div class="kicker">РЦЗК · АТОМНАЯ ЭНЕРГЕТИКА</div><h1>Знания.<br>Компетенции.<br>Развитие.</h1><p>Информационно-образовательная платформа Регионального центра знаний и компетенций в области атомной энергии</p></header><nav class="tabs" id="tabs" aria-label="Разделы центра"></nav><main class="content" id="content"></main><footer class="foot">РЕГИОНАЛЬНЫЙ ЦЕНТР ЗНАНИЙ И КОМПЕТЕНЦИЙ · ТЕСТОВАЯ ВЕРСИЯ</footer></div><script>
const sections=[
{id:'about',title:'О Центре',subtitle:'Направления деятельности',lead:'Информация о целях, задачах и направлениях работы Центра.',items:[['◈','Миссия Центра','Развитие компетенций и кадрового потенциала в области атомной энергии.'],['⌁','Основные направления','Профессиональное обучение, обмен знаниями, научно-практическое взаимодействие.']]},
{id:'news',title:'Новости',subtitle:'Информационная лента',lead:'Официальные сообщения и важные события Центра.',items:[['▤','Новости Центра','Здесь будут размещаться проверенные новости и итоги работы.'],['✦','Достижения','Отдельные сообщения о результатах и ключевых событиях.']]},
{id:'study',title:'Обучение',subtitle:'Программы и компетенции',lead:'Подготовка, переподготовка и повышение квалификации специалистов.',items:[['▣','Программы обучения','Описание курсов, условия участия и порядок регистрации.'],['⚙','Практическая подготовка','Лабораторные занятия и развитие прикладных навыков.'],['◷','Календарь','Информация о ближайших учебных мероприятиях.']]},
{id:'events',title:'Мероприятия',subtitle:'Афиша и события',lead:'Семинары, конференции, лекции и профессиональные встречи.',items:[['▦','Ближайшие мероприятия','Сведения о предстоящих событиях и регистрации.'],['◎','Итоги мероприятий','Обзоры и материалы по результатам проведения.']]},
{id:'materials',title:'Материалы',subtitle:'Библиотека знаний',lead:'Открытые учебные и методические материалы.',items:[['▤','Учебные пособия','Подборка учебных и методических документов.'],['▧','Презентации','Материалы докладов и образовательных курсов.'],['▰','Документы','Открытые информационные материалы для специалистов.']]},
{id:'partners',title:'Партнёрство',subtitle:'Сотрудничество',lead:'Развитие взаимодействия с профильными научными, образовательными и отраслевыми организациями.',items:[['◇','Образовательные партнёры','Совместные образовательные инициативы и профессиональные программы.'],['⌘','Отраслевое взаимодействие','Обмен знаниями и опытом с профильными организациями.']]}
];
let selected='about';function render(){let s=sections.find(x=>x.id===selected);document.querySelector('#tabs').innerHTML=sections.map(x=>`<button class="tab ${x.id===selected?'active':''}" data-id="${x.id}" aria-pressed="${x.id===selected}">${x.title}</button>`).join('');document.querySelector('#content').innerHTML=`<div class="eyebrow">${s.subtitle}</div><h2>${s.title}</h2><p class="lead">${s.lead}</p><div class="notice">Демонстрационная версия: сведения и документы будут добавлены после согласования содержания.</div><div class="cards">${s.items.map(c=>`<article class="card"><div class="icon" aria-hidden="true">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p></article>`).join('')}</div>`;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()});}render();if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
</script></body></html>
